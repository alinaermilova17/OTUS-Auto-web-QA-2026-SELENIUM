networks:
  default:
    name: selenoid
    external: true

services:

  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442-4444:4442-4444"
    networks:
      - default

  chrome:
    image: selenium/node-chrome:latest
    container_name: selenium-chrome
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
    networks:
      - default

  firefox:
    image: selenium/node-firefox:latest
    container_name: selenium-firefox
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
    networks:
      - default

  mysql:
    image: mysql:5.7
    container_name: prestashop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-padmin']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  prestashop:
    image: prestashop/prestashop:1.7.8.11
    container_name: prestashop
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8081:80'
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_INSTALL_AUTO: 1
      PS_DEV_MODE: 1
      PS_DOMAIN: localhost:8081
    volumes:
      - psdata:/var/www/html
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - default

  tests:
    build: .
    image: prestashop-tests:latest
    container_name: prestashop_tests
    depends_on:
      prestashop:
        condition: service_healthy
      selenium-hub:
        condition: service_started
    environment:
      - URL=http://prestashop:80
      - BROWSER=chrome
      - BROWSER_VERSION=latest
      - EXECUTOR=selenoid
      - EXECUTOR_URL=http://selenium-hub:4444/wd/hub
    volumes:
      - ./tests_selenium:/app/tests_selenium
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
    entrypoint: [ 'pytest' ]
    command: [
      'tests_selenium/tests/',
      '-v',
      '--browser=chrome',
      '--browser_version=latest',
      '--executor=selenoid',
      '--executor_url=http://selenium-hub:4444/wd/hub',
      '--url=http://prestashop:80'
    ]
    networks:
      - default

volumes:
  dbdata:
  psdata: